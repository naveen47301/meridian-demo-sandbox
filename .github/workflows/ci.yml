name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail when the demo marker file exists
        run: |
          if [ -f FAIL_CI ]; then echo "FAIL_CI marker present"; exit 1; fi
      - name: Placeholder checks
        run: echo "checks passed"
